# Local deployment (F17): docker compose up --build, then open http://localhost:5173
# The API reads the private root .env and backend/.env (never committed); the web app reads the root .env. The database is the hosted Supabase project.
services:
  api:
    build: ./backend
    env_file:
      - {path: .env, required: false}
      - {path: backend/.env, required: false}
    environment:
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports: ["8000:8000"]
  web:
    build: ./frontend
    env_file:
      - {path: .env, required: false}
    environment:
      BACKEND_HOST: api
      BACKEND_PORT: "8000"
      VITE_API_URL: /api
    volumes: ["./.env:/.env:ro"]
    ports: ["5173:5173"]
    depends_on: [api]
