
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.128.8",
    "uvicorn==0.39.0",
    "supabase==2.32.0",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.2.16,<1.3",
    "langsmith>=0.14,<0.15",
    "python-dotenv==1.2.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.11.0",
    "sse-starlette==3.3.0",
    "httpx==0.28.1",
    "PyJWT[crypto]==2.15.1",
    "psycopg[binary]==3.3.6",
    "pypdf==6.21.1",
    "defusedxml==0.7.1",
    "psutil==7.2.2",
    "Pillow==13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
dbtest = ["pgserver==0.1.4"]

[tool.setuptools.packages.find]
include = ["app*", "evaluation*", "scripts*"]

[tool.setuptools.package-data]
app = ["prompts/*/v*/*.md"]
evaluation = ["*cases.json"]
scripts = ["*.swift"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Official native binary used only by the opt-in local Data API integration suite.
[tool.demobank.postgrest]
version = "14.18"

