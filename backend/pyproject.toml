
[project]
name = "chatbot-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.128.8",
    "uvicorn==0.39.0",
    "supabase==2.32.0",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "python-dotenv==1.2.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.11.0",
    "sse-starlette==3.3.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
